<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fazenda Digital · Raiz</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/favicon.svg" alt="" width="34" height="34"><div><b>Fazenda Digital</b><span>Ambiente de testes do Raiz · dados simulados</span></div></div>
  <div class="clock" aria-live="off"><b id="clkTime">05:30</b><span id="clkDate">—</span><span id="clkWx" class="wx"></span></div>
  <div class="speed" role="group" aria-label="Velocidade da simulação"><span class="lab">Velocidade</span><div id="speedBtns" class="seg"></div></div>
  <div class="chips"><span class="pill" id="hGw"><i></i>Gateway</span><span class="pill" id="hNet"><i></i>Internet</span><span class="pill" id="hApp"><i></i>App</span></div>
  <div class="actions"><button class="btn" id="btnPhone" aria-pressed="true">Mostrar app</button><a class="btn" id="btnOpen" href="#" target="_blank" rel="noopener">Abrir app em outra aba</a></div>
</header>

<main class="layout" id="layout">
  <section class="left">
    <div class="stage" id="stage"><svg id="scene" role="img" aria-label="Fazenda desenhada: três talhões de cana, poço, bomba e dispositivos"></svg>
      <div class="stage-hint" id="hint">Clique em um talhão para selecioná-lo · clique no poço, no gateway, no sensor ou no medidor para ligar/desligar a falha correspondente.</div></div>
    <section class="dock" aria-label="Painel de controle">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="panel" id="panel"></div>
    </section>
  </section>
  <aside class="phonecol" id="phoneCol">
    <div class="phone"><iframe id="appFrame" title="App Raiz (WebView)" allow="clipboard-write"></iframe></div>
    <div class="phone-tools"><label class="chk"><input type="checkbox" id="autoLogin" checked> Entrar automaticamente</label><button class="btn sm" id="btnReload">Reiniciar app</button></div>
  </aside>
</main>

<script src="js/config.js"></script>
<script src="js/link.js"></script>
<script src="js/sim.js"></script>
<script src="js/gateway.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
